name: Build Pi Image with pi-gen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run pi-gen build
        run: ./build-docker.sh
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: deploy/*.zip
